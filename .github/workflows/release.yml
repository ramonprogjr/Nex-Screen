name: release

# Pushing a tag like v0.1.0 builds everything from source and publishes a GitHub Release with the artifacts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build driver package
        shell: pwsh
        run: ./tools/build-driver.ps1 -Configuration Release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test companion
        shell: pwsh
        run: dotnet test windows/NexScreen.sln -c Release --nologo

      - name: Publish companion (self-contained, win-x64)
        shell: pwsh
        run: >
          dotnet publish windows/companion/src/NexScreen.Companion/NexScreen.Companion.csproj
          -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
          -o out/companion --nologo

      # Pinned Inno Setup, VDD and Platform-Tools, each verified by SHA256 and Authenticode (see the script).
      # nexscreen-vdd-ctl.exe comes from the driver build above.
      - name: Build installer
        shell: pwsh
        run: >
          ./tools/build-installer.ps1 -Version '${{ github.ref_name }}'
          -CompanionDir out/companion -SkipDriverBuild -InstallInnoSetup

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/installer/NexScreen-Setup-$v.exe" dist/
          Copy-Item README.md, LICENSE out/driver/
          Copy-Item driver/virtual-display/THIRD_PARTY.md out/driver/
          Compress-Archive out/driver/* "dist/NexScreen-driver-$v-x64-unsigned.zip"
          Copy-Item README.md, LICENSE out/companion/
          Compress-Archive out/companion/* "dist/NexScreen-companion-$v-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Build and test
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug test

      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NexScreen-android-${GITHUB_REF_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: dist/

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          NexScreen turns an Android tablet into an extended monitor for Windows 10/11, over USB or Wi-Fi.

          **Windows: download `NexScreen-Setup-*.exe`** and run it. It installs everything in one go (needs
          administrator once): the companion in the notification area, adb (Android SDK Platform-Tools) and the
          signed [Virtual Display Driver](https://github.com/VirtualDrivers/Virtual-Display-Driver) as the virtual
          monitor. Uninstall from Settings > Apps.

          The installer is **not code-signed yet**, so Windows SmartScreen shows "Windows protected your PC": click
          **More info** and then **Run anyway**.

          O instalador ainda **não é assinado**: na tela azul "O Windows protegeu o computador", clique em
          **Mais informações** e depois em **Executar assim mesmo**.

          **Assets**
          - `NexScreen-Setup-*.exe`: Windows installer (recommended).
          - `NexScreen-android-*-debug.apk`: Android app (debug-signed).
          - `NexScreen-companion-*-win-x64.zip`: Windows companion only (self-contained, no .NET install needed),
            for manual setups.
          - `NexScreen-driver-*-x64-unsigned.zip`: NexScreen's own virtual display driver, for development. **Not
            code-signed**: it only installs on Windows in test mode. The installer uses the signed Virtual Display
            Driver instead.

          All binaries are built from this tag by GitHub Actions and are not code-signed. See the README for usage,
          privacy and uninstall instructions.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "NexScreen $GITHUB_REF_NAME" --notes-file notes.md --prerelease
